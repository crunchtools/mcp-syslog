# =============================================================================
# mcp-syslog — Nagios host and service definitions
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/mcp-syslog.cfg
#
# Add ctr-mcp-syslog.crunchtools.com to the `mcp-services` hostgroup members line
# in container-hosts.cfg, and append nrpe-commands.cfg to the agent's nrpe.cfg.
# =============================================================================

define host {
    use                 crunchtools-container
    host_name           ctr-mcp-syslog.crunchtools.com
    alias               mcp-syslog container
    address             10.88.0.1
    check_command       check_nrpe_command!10.88.0.1!check_ctr_run_mcp_syslog
}

define service {
    use                     crunchtools-service
    host_name               ctr-mcp-syslog.crunchtools.com
    service_description     Memory
    check_command           check_nrpe_command!10.88.0.1!check_ctr_mem_mcp_syslog
    notes                   Container capped at 512m
}

define service {
    use                     crunchtools-service
    host_name               ctr-mcp-syslog.crunchtools.com
    service_description     MCP Port
    check_command           check_nrpe_command!10.88.0.1!check_tcp_8027
    notes                   streamable-http MCP endpoint on 127.0.0.1:8027, fronted by the Trentina gateway
}
