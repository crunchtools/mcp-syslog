# Gourmand exceptions.
#
# This file was previously a verbatim copy of mcp-nagios's, so every path in it
# pointed at src/mcp_nagios_crunchtools/ and matched nothing here. Rewritten
# against this repo.

[[exceptions]]
check = "summary_litter"
path = "CLAUDE.md"
justification = "Required by the CrunchTools constitution as the project's agent instructions; it is not a status report."

[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_syslog_crunchtools/query.py"
justification = "_passes_filters is a six-condition predicate evaluated per log line inside a nested loop over sources and files. Inlining it puts six conditions in the middle of that loop; keeping it named also makes the filter semantics testable on their own."

[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_syslog_crunchtools/tools/stats.py"
justification = "_collect is the scan-and-tally pass; its caller is the formatting pass. Merging them would mix I/O and rendering in one function, and _collect's scan-limit behaviour would stop being testable in isolation."
